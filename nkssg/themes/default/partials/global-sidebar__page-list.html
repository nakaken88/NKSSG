{% set page_items = singles | selectattr('post_type', 'eq', 'page') | list %}
{% if page_items %}
<div class="widget">
  <div class="widget__title">Page List</div>
  <div class="widget__body">
    <ul>
      {% for page in page_items %}
      <li>
        <a href="{{ page.url }}">{{ page.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endif %}
