{% set tag_items = archives.get_terms('tag')
    | selectattr('singles_all_count', 'gt', 0)
    | sort(attribute='singles_all_count', reverse=True)
    | list %}
{% if tag_items %}
<div class="widget">
  <div class="widget__title">Tag List</div>
  <div class="widget__body widget__body--tags">
    {% for archive in tag_items %}
    <span><a href="{{ archive.url }}">{{ archive.name }}</a> ({{ archive.singles_all_count }})</span>
    {% endfor %}
  </div>
</div>
{% endif %}
