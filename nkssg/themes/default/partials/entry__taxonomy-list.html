{% set tax_items = mypage.archive_list | selectattr('archive_type', 'eq', 'taxonomy') | list %}
{% for group in tax_items | groupby('root_name') %}
<div class="entry__taxonomy-list">
  {{ group.grouper.capitalize() }}:
  {% for archive in group.list %}
  <a href="{{ archive.url }}">{{ archive.name }}</a>
  {% endfor %}
</div>
{% endfor %}
