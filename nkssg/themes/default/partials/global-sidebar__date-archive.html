{% set root = archives.get_root_archive('date', 'post') %}
{% if root and root.children %}
<div class="widget">
  <div class="widget__title">Archive</div>
  <div class="widget__body">
    <ul>
    {% for archive in root.children.values() | sort(attribute='name', reverse=True) %}
      <li>
        <a href="{{ archive.url }}">{{ archive.name }}</a> ({{ archive.singles_all_count }})
      </li>
    {% endfor %}
    </ul>
  </div>
</div>
{% endif %}
