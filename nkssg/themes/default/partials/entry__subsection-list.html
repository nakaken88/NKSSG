{% if mypage.archive_type == 'section' %}
{% set subsections = mypage.children.values() | selectattr('singles_all_count', 'gt', 0) | list %}
{% if subsections %}
<div class="entry__subsection-list">
  <h2>Sub section</h2>
  <ul>
    {% for child in subsections %}
    <li>
      <a href="{{ child.url }}">{{ child.title }}</a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endif %}
{% endif %}
