{% set nav_items = archives
    | selectattr('is_root')
    | selectattr('archive_type', 'in', ['date', 'section', 'simple'])
    | list %}
{% if nav_items %}
<nav class="global-nav">
  <ul class="global-nav__list">
    {% for a in nav_items %}
    <li class="global-nav__item">
      <a href="{{ a.url }}" class="global-nav__link">{{ a.name }}</a>
    </li>
    {% endfor %}
  </ul>
</nav>
{% endif %}
